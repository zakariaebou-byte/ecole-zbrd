  background:var(--bg);
  color:var(--ink);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

a{
  color:inherit
}

input,select{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 13px;
  background:var(--card);
  color:var(--ink);
  outline:none
}

input:focus,select:focus{
  border-color:#111827;
  box-shadow:0 0 0 3px rgba(17,24,39,.10)
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:0 0 7px
}

.field{
  margin-bottom:13px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 4px 16px rgba(17,24,39,.04)
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  font-weight:700
}

.btn-primary{
  background:#111827;
  color:white;
  border:0;
  border-radius:12px;
  padding:13px 16px;
  font-weight:800;
  width:100%
}

.btn-primary:hover{
  background:#000000
}

.btn-ghost{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 14px;
  font-weight:700;
  color:var(--ink)
}

.btn-outline{
  background:transparent;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 14px;
  font-weight:700
}

.small{
  font-size:13px;
  line-height:1.5;
  color:var(--muted)
}

.nav-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:8px 2px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  border-radius:10px
}

.nav-btn.active{
  color:#111827;
  background:#F6F7F9
}

@media (prefers-color-scheme: dark){
  .nav-btn.active{
    background:#1B2330;
    color:#fff
  }
}

.hover\:bg-red-50:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(254 242 242 / var(--tw-bg-opacity, 1));
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

@media (min-width: 640px) {
  .sm\:w-\[220px\] {
    width: 220px;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:place-items-center {
    place-items: center;
  }

  .sm\:gap-x-4 {
    -moz-column-gap: 1rem;
         column-gap: 1rem;
  }

  .sm\:rounded-\[24px\] {
    border-radius: 24px;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:pb-28 {
    padding-bottom: 7rem;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.15fr_\.85fr\] {
    grid-template-columns: 1.15fr .85fr;
  }
}
</style>
